# Reuse the EXISTING Caddy network. This stack never binds ports 80 or 443.
name: remote-desktop
services:
  signaling:
    build:
      context: ../..
      dockerfile: deploy/signaling/Dockerfile
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.50
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=32m
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      Signaling__Audience: rdc-signaling
      Signaling__SessionTokenKeyBase64: ${SESSION_TOKEN_KEY_BASE64:?Set a random session key}
      Signaling__Turn__SharedSecret: ${TURN_SHARED_SECRET:?Set a random TURN secret}
      Signaling__Turn__Uris__0: turn:${PUBLIC_IP:?Set the public server IP}:3478?transport=udp
    networks:
      proxy:
        aliases:
          - remote-desktop-signaling
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
  turn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 128
    command:
      - -n
      - --log-file=stdout
      - --realm=${PUBLIC_HOST:?Set the signaling hostname}
      - --listening-port=3478
      - --external-ip=${PUBLIC_IP:?Set the public server IP}
      - --min-port=49160
      - --max-port=49200
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:?Set a random TURN secret}
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --user-quota=2
      - --total-quota=4
      - --max-bps=1500000
      - --bps-capacity=3000000
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?Set the existing Caddy Docker network}
